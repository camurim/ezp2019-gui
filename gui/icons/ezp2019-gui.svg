<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="zif" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="13" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <!-- ZIF Lever -->
  <rect x="11" y="10" width="12" height="5" rx="2" fill="#cbd5e1"/>
  <circle cx="13" cy="12.5" r="2.2" fill="#f8fafc"/>
  <!-- ZIF Socket body -->
  <rect x="17" y="13" width="30" height="38" rx="4" fill="url(#zif)" stroke="#14532d" stroke-width="1.8"/>
  <path d="M 28 13 A 4 4 0 0 0 36 13 Z" fill="#14532d"/>
  <!-- 8 left + 8 right ZIF pins -->
  <g fill="#0f172a">
    <circle cx="22" cy="20" r="1.6"/><circle cx="42" cy="20" r="1.6"/>
    <circle cx="22" cy="25" r="1.6"/><circle cx="42" cy="25" r="1.6"/>
    <circle cx="22" cy="30" r="1.6"/><circle cx="42" cy="30" r="1.6"/>
    <circle cx="22" cy="35" r="1.6"/><circle cx="42" cy="35" r="1.6"/>
    <circle cx="22" cy="40" r="1.6"/><circle cx="42" cy="40" r="1.6"/>
    <circle cx="22" cy="45" r="1.6"/><circle cx="42" cy="45" r="1.6"/>
  </g>
  <!-- Seated 8-pin IC -->
  <rect x="25" y="18" width="14" height="19" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4"/>
  <circle cx="28.5" cy="21.5" r="1.5" fill="#facc15"/>
  <!-- Status LED -->
  <circle cx="51" cy="14" r="3" fill="#38bdf8"/>
</svg>
