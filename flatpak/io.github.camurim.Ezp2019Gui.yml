app-id: io.github.camurim.Ezp2019Gui
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: ezp2019-gui

rename-desktop-file: ezp2019-gui.desktop
rename-icon: ezp2019-gui

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all

modules:
  - name: ezp2019-gui
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_GUI=ON
    sources:
      - type: dir
        path: ..

